{% extends "base.html" %}

{% block content %}
  <a>Current Value: <span id="state">Unknown</span></a>
  <button onclick="sdoRead()">Get</button>
  <br/>
  <br/>
  <a>Change Value (card, index, subindex, new value): </a>
  <input type="text" id="card"/>
  <input type="text" id="index"/>
  <input type="text" id="subindex"/>
  <input type="text" id="value"/>
  <button onclick="sdoWrite()">Set</button>
  <script>
    async function sdoWrite() {
      const card = document.getElementById("card").value;
      const index = document.getElementById("index").value;
      const subindex = document.getElementById("subindex").value;
      const value = document.getElementById("value").value;
      let options = {
        "method": "PUT",
        headers: {
          "Content-Type": "application/json",
        },
        "body": JSON.stringify({
          "value": value,
        }),
      };

      let url = `http://${window.location.host}/sdo/${card}/${index}`;
      if (subindex !== null && subindex !== "") {
        url = `http://${window.location.host}/sdo/${card}/${index}/${subindex}`;
      }

      return await fetch(url, options)
        .then(response => response.json())
        .then(data => {
          if (data.error !== undefined) {
            console.error(data.error);
          }
          document.getElementById("state").innerHTML = data.value;
          return data;
        });
    }

    async function sdoRead() {
      const card = document.getElementById("card").value;
      const index = document.getElementById("index").value;
      const subindex = document.getElementById("subindex").value;

      let url = `http://${window.location.host}/sdo/${card}/${index}`;
      if (subindex !== null && subindex !== "") {
        url = `http://${window.location.host}/sdo/${card}/${index}/${subindex}`;
      }

      return await fetch(url)
        .then(response => response.json())
        .then(data => {
          if (data.error !== undefined) {
            console.error(data.error);
          }
          document.getElementById("state").innerHTML = data.value;
          return data;
        });
    }

    sdoRead();
    const interval = setInterval(function() {
      sdoRead();
    }, 1000);
  </script>
{% endblock %}
